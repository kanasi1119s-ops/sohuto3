<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会議コストメーター | Kaigi Cost Meter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <h1>会議コストメーター</h1>
      <button id="fullscreenBtn" class="ghost-btn" type="button">大画面表示</button>
    </header>

    <main>
      <section id="setupPanel" class="panel">
        <h2>会議の設定</h2>
        <div class="field">
          <label for="participants">参加人数</label>
          <input type="number" id="participants" min="1" value="5">
        </div>
        <div class="field">
          <label for="salaryBand">参加者の平均年収帯（概算計算用）</label>
          <select id="salaryBand">
            <option value="4000000">〜400万円</option>
            <option value="5000000" selected>500万円前後</option>
            <option value="6000000">600万円前後</option>
            <option value="7000000">700万円前後</option>
            <option value="8000000">800万円前後</option>
            <option value="10000000">1000万円前後</option>
          </select>
        </div>
        <p class="hint">※ 時給は「年収 ÷ 1700時間」で概算しています（一般的な年間総労働時間の目安に基づく簡易計算であり、実際の人件費を保証するものではありません）。</p>
        <button id="startBtn" class="primary-btn" type="button">会議を開始する</button>
      </section>

      <section id="meterPanel" class="panel hidden">
        <div class="meter">
          <div class="cost" id="costDisplay">¥0</div>
          <div class="submeta">
            <span id="elapsedDisplay">00:00:00</span>
            <span id="participantsDisplay"></span>
          </div>
        </div>
        <div class="controls">
          <button id="stopBtn" class="danger-btn" type="button">会議を終了する</button>
        </div>
      </section>

      <section id="summaryPanel" class="panel hidden">
        <h2>会議サマリー</h2>
        <ul id="summaryList" class="summary-list"></ul>
        <div class="controls">
          <button id="copyBtn" class="ghost-btn" type="button">結果をコピー</button>
          <button id="resetBtn" class="primary-btn" type="button">新しい会議を開始</button>
        </div>
        <p id="copyStatus" class="copy-status" aria-live="polite"></p>
      </section>
    </main>

    <footer>
      <p>Kaigi Cost Meter（無料版） — データはブラウザ内にのみ保存され、サーバーには送信されません。</p>
    </footer>
  </div>

<script src="script.js"></script>
</body>
</html>
