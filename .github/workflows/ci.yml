name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ユニットテスト
        run: node tests/game.test.js
      - name: バランス簡易チェック（回帰用に出力のみ）
        run: node scripts/simulate.js 200
