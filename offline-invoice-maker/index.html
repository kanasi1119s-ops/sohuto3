<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="./manifest.webmanifest">
<title>オフライン請求書メーカー</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header class="no-print"><h1>オフライン請求書メーカー</h1><p class="sub">データはこの端末のブラウザ内にのみ保存されます（外部送信なし）</p></header>
<main>
<details class="no-print" id="settings-box"><summary>発行者設定</summary>
<div class="grid">
<label>発行者名<input id="s-name" maxlength="200"></label>
<label>登録番号（T+13桁）<input id="s-reg" placeholder="T1234567890123" maxlength="14"><small id="s-reg-err" class="err"></small></label>
<label class="wide">住所<textarea id="s-addr" rows="2" maxlength="500"></textarea></label>
<label class="wide">振込先<textarea id="s-bank" rows="2" maxlength="500"></textarea></label>
<label>端数処理<select id="s-round"><option value="floor">切り捨て</option><option value="round">四捨五入</option><option value="ceil">切り上げ</option></select></label>
<label class="chk"><input type="checkbox" id="s-wh"> 源泉徴収を計算する</label>
</div></details>

<section class="no-print"><h2>請求書一覧</h2>
<div class="row"><button id="new-inv">新規作成</button><button id="export-json">JSONバックアップ</button>
<label class="btn">JSONを読み込む<input type="file" id="import-json" accept="application/json,.json" hidden></label><button id="export-csv">CSV出力</button></div>
<p id="msg" role="status"></p>
<ul id="list"></ul></section>

<section class="no-print" id="editor"><h2>編集</h2>
<div class="grid">
<label>請求書番号<input id="e-number" maxlength="64"></label>
<label>請求先<input id="e-client" maxlength="200"></label>
<label>発行日<input type="date" id="e-issue"></label>
<label>支払期限<input type="date" id="e-due"></label>
<label class="wide">備考<textarea id="e-note" rows="2" maxlength="1000"></textarea></label>
</div>
<table id="lines"><thead><tr><th>品目</th><th>数量</th><th>単価(税抜)</th><th>税率</th><th></th></tr></thead><tbody></tbody></table>
<p id="line-err" class="err" role="alert"></p>
<div class="row"><button id="add-line">明細を追加</button><button id="save-inv" class="primary">保存</button><button id="print-inv">印刷 / PDF保存</button></div>
</section>

<section id="preview-box"><h2 class="no-print">プレビュー</h2><div id="preview"></div></section>
</main>
<footer class="no-print"><small>※ 会計・税務の最終判断は税理士等にご確認ください。</small></footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
