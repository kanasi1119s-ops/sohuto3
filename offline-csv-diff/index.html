<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:">
<title>オフラインCSV差分</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;max-width:960px;margin-inline:auto;line-height:1.5}
fieldset{margin:0 0 12px;padding:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border:1px solid #bbb;padding:4px 8px;text-align:left;word-break:break-all}
.add{background:#e6ffed}.del{background:#ffeef0}.chg{background:#fff8c5}
.err{color:#b00020}.note{color:#555;font-size:13px}
@media(max-width:600px){td,th{padding:2px 4px}}
</style>
</head>
<body>
<h1>オフラインCSV差分</h1>
<p class="note">ファイルは端末の外へ送信されません(通信は遮断設定)。Shift_JIS / UTF-8 を自動判定します。</p>
<fieldset><legend>1. ファイルを選ぶ</legend>
<label>旧: <input id="fa" type="file" accept=".csv,.tsv,.txt"></label><br>
<label>新: <input id="fb" type="file" accept=".csv,.tsv,.txt"></label><br>
<label>文字コード:
<select id="enc"><option value="auto">自動判定</option><option value="utf-8">UTF-8</option><option value="shift_jis">Shift_JIS</option></select></label>
</fieldset>
<fieldset><legend>2. キー列(複数選択可)</legend>
<select id="keys" multiple size="5" aria-label="キー列"></select>
<p class="note">Ctrl/Cmd+クリックで複数選択。</p>
<button id="run" type="button">比較する</button>
<button id="dl" type="button" disabled>差分をCSVで保存</button>
</fieldset>
<p id="msg" role="status"></p>
<div id="out"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
