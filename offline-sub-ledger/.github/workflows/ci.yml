name: ci
on: [push, pull_request]
defaults: { run: { working-directory: offline-sub-ledger } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: offline-sub-ledger/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium && npm run e2e
