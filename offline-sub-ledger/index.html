<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="データが端末から出ない、オフライン対応のサブスク管理ツール" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>サブスク台帳</title>
</head>
<body>
  <main>
    <h1>サブスク台帳</h1>
    <p class="muted">データはこの端末のブラウザ内にのみ保存されます。外部へは送信しません。</p>

    <section id="summary" aria-label="合計">
      <div><span class="label">月額換算</span><strong id="t-monthly">¥0</strong></div>
      <div><span class="label">年額換算</span><strong id="t-yearly">¥0</strong></div>
      <div><span class="label">有効な契約</span><strong id="t-count">0</strong></div>
    </section>

    <p id="msg" role="status" aria-live="polite"></p>

    <form id="form" novalidate>
      <h2 id="form-title">追加</h2>
      <label>名前 <input name="name" maxlength="100" required /></label>
      <label>金額（税込・円） <input name="amount" type="number" min="0" step="1" inputmode="numeric" required /></label>
      <label>周期
        <select name="cycle">
          <option value="monthly">毎月</option>
          <option value="yearly">毎年</option>
          <option value="quarterly">3か月ごと</option>
          <option value="weekly">毎週</option>
        </select>
      </label>
      <label>次回請求日 <input name="nextBilling" type="date" required /></label>
      <label>カテゴリ <input name="category" maxlength="50" /></label>
      <label>メモ <input name="note" maxlength="500" /></label>
      <div class="row">
        <button type="submit" id="submit">追加する</button>
        <button type="button" id="cancel" hidden>編集をやめる</button>
      </div>
    </form>

    <section>
      <h2>7日以内の請求</h2>
      <ul id="upcoming"></ul>
    </section>

    <section>
      <h2>一覧</h2>
      <ul id="list"></ul>
    </section>

    <section>
      <h2>バックアップ</h2>
      <div class="row">
        <button type="button" id="export-json">JSONで書き出す</button>
        <button type="button" id="export-csv">CSVで書き出す</button>
        <label class="btn">JSONを読み込む（置き換え）<input type="file" id="import" accept="application/json,.json" hidden /></label>
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
